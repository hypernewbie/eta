<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>η eta</title>
    <!-- Every browser dependency is served from this binary. Eta is a
         LAN/Tailnet filesystem browser: it must render with no route to
         the public internet, and it should not announce each page view to
         a third party. Refresh web/vendor/ with `npm run vendor`. -->
    <link rel="stylesheet" href="vendor/fonts/fonts.css" />
    <link rel="stylesheet" href="vendor/shoelace/themes/dark.css" />
    <link rel="stylesheet" href="vendor/highlight-github-dark.min.css" />
    <link rel="stylesheet" href="vendor/winbox/winbox.min.css" />
    <link rel="stylesheet" href="vendor/xterm/xterm.css" />
    <link
      rel="stylesheet"
      href="vendor/prism/plugins/line-numbers/prism-line-numbers.css"
    />
    <link rel="stylesheet" href="style.css" />
    <!-- data-shoelace is required, not decoration. The autoloader resolves a
         component with import(getBasePath("components/x/x.js")), and derives
         that base from this script's src. A relative src yields the bare
         specifier "vendor/shoelace/components/x/x.js", which is not a legal
         module specifier; the import throws, Promise.allSettled swallows it,
         and every <sl-*> silently stays an inert unknown element. It worked
         on the CDN only because that src was an absolute URL. -->
    <script
      type="module"
      src="vendor/shoelace/shoelace-autoloader.js"
      data-shoelace="/vendor/shoelace"
    ></script>
    <script src="vendor/lucide/lucide.min.js"></script>
    <script src="vendor/icons/file-icons.js"></script>
    <script src="vendor/dayjs/dayjs.min.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="vendor/prism/prism.js"></script>
    <script src="vendor/prism/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="vendor/prism/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="vendor/winbox/winbox.bundle.min.js"></script>
    <script src="vendor/xterm/xterm.js"></script>
    <script src="vendor/xterm/addon-fit.js"></script>
  </head>
  <body class="sl-theme-dark">
    <main class="app-shell">
      <header class="app-header">
        <div class="brand">
          <span class="logo-glow-wrapper"><span class="logo">η</span></span>
          <span class="brand-name">eta</span>
          <div class="hostname-wrapper">
            <span
              id="terminal-activity-indicator"
              class="terminal-activity-indicator"
              >—</span
            >
            <span id="hostname-display" class="hostname-display"></span>
          </div>
        </div>
        <div class="header-actions">
          <!-- Silent while healthy. A badge that always reads CONNECTED
               carries no information; this appears only when it does. -->
          <div class="header-status" id="header-status" hidden>
            <span class="pulse"></span><span id="server-status">OFFLINE</span>
          </div>
          <button class="icon-button" id="add-peer-button" title="Add PC">
            <i data-lucide="plus"></i>
          </button>
          <button
            class="icon-button"
            id="theme-button"
            title="Change identity color"
          >
            <i data-lucide="palette"></i>
          </button>
        </div>
      </header>

      <div id="explorer-backstore"></div>
      <template id="explorer-template">
        <section class="browser-panel" aria-label="Filesystem browser">
          <div class="tab-strip" data-explorer="tab-strip" role="tablist"></div>
          <div class="toolbar">
            <label class="root-picker"
              ><i data-lucide="hard-drive"></i
              ><select
                data-explorer="root-select"
                aria-label="Filesystem root"
              ></select
              ><i data-lucide="chevron-down" class="chevron"></i
            ></label>
            <nav
              class="breadcrumbs"
              data-explorer="breadcrumbs"
              aria-label="Breadcrumb"
            ></nav>
            <div class="toolbar-actions">
              <button
                class="icon-button"
                data-explorer="hidden-toggle"
                title="Show hidden files"
                aria-pressed="false"
              >
                <i data-lucide="eye-off"></i></button
              ><button
                class="icon-button"
                data-explorer="view-toggle"
                title="Toggle image grid"
              >
                <i data-lucide="layout-grid"></i></button
              ><button
                class="icon-button"
                data-explorer="up-button"
                title="Up one folder"
              >
                <i data-lucide="arrow-up"></i></button
              ><button
                class="icon-button"
                data-explorer="refresh-button"
                title="Refresh"
              >
                <i data-lucide="refresh-cw"></i>
              </button>
            </div>
          </div>
          <div class="file-table" data-explorer="file-table">
            <div class="table-head">
              <span>Name</span><span>Modified</span><span>Size</span>
            </div>
            <div
              data-explorer="entries"
              class="entries"
              aria-live="polite"
            ></div>
          </div>
          <footer class="panel-footer">
            <span data-explorer="item-count">—</span>
            <span
              class="footer-selection"
              data-explorer="selection-info"
            ></span>
            <span class="footer-size" data-explorer="total-size"></span>
          </footer>
        </section>
      </template>
    </main>
    <div
      id="desktop-icons"
      class="desktop-icons"
      aria-label="Desktop"
      hidden
    ></div>
    <div id="desktop-context-menu" class="file-context-menu" hidden>
      <button type="button" data-desktop-action="open">
        <i data-lucide="folder-open"></i> Open
      </button>
      <button type="button" data-desktop-action="unpin" class="danger">
        <i data-lucide="pin-off"></i> Remove from Desktop
      </button>
    </div>
    <nav id="taskbar" class="taskbar" aria-label="Desktop taskbar">
      <button
        id="eta-launcher"
        class="eta-launcher"
        title="Open Explorer"
        aria-label="Open Explorer"
      >
        <span aria-hidden="true">η</span>
      </button>
      <div id="task-strip" class="task-strip" aria-label="Open windows"></div>
    </nav>
    <section id="eta-menu" class="eta-menu" aria-label="Computers" hidden>
      <div class="eta-menu-label">COMPUTERS</div>
      <div id="eta-menu-locations"></div>
    </section>

    <div id="file-context-menu" class="file-context-menu" hidden>
      <button type="button" data-file-action="trusted-html" hidden>
        <i data-lucide="external-link"></i> Open HTML trusted
      </button>
      <button type="button" data-file-action="terminal">
        <i data-lucide="terminal-square"></i> Open Terminal Here
      </button>
      <button type="button" data-file-action="copy">
        <i data-lucide="copy"></i> Copy
      </button>
      <button type="button" data-file-action="cut">
        <i data-lucide="scissors"></i> Cut
      </button>
      <button type="button" data-file-action="paste">
        <i data-lucide="clipboard-paste"></i> Paste into Folder
      </button>
      <button type="button" data-file-action="pin">
        <i data-lucide="pin"></i> Add to Desktop
      </button>
      <button type="button" data-file-action="rename">
        <i data-lucide="pencil"></i> Rename
      </button>
      <button type="button" data-file-action="delete" class="danger">
        <i data-lucide="trash-2"></i> Delete
      </button>
    </div>
    <sl-dialog id="preview-dialog" label="File preview" class="preview-dialog"
      ><div id="preview-content"></div>
      <div slot="footer">
        <sl-button id="copy-button"
          ><i data-lucide="copy"></i> Copy text</sl-button
        ><sl-button id="download-button" variant="primary"
          ><i data-lucide="download"></i> Download</sl-button
        ><sl-button id="close-dialog">Close</sl-button>
      </div></sl-dialog
    >
    <sl-dialog
      id="theme-dialog"
      label="Choose an identity color"
      class="theme-dialog"
      ><div class="swatches" id="swatches"></div
    ></sl-dialog>
    <sl-alert id="error-toast" variant="danger" duration="5000" closable
      ><i slot="icon" data-lucide="circle-alert"></i
      ><span id="error-message"></span
    ></sl-alert>
    <script src="generated/app.js"></script>
  </body>
</html>
