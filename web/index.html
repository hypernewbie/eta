<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <meta name="color-scheme" content="dark" />
    <title>η eta</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/themes/dark.css"
    />
    <link rel="stylesheet" href="vendor/highlight-github-dark.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/css/winbox.min.css"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.css"
    />
    <link rel="stylesheet" href="style.css" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/@shoelace-style/shoelace@2.20.1/cdn/shoelace-autoloader.js"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://code.iconify.design/iconify-icon/3.0.0/iconify-icon.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/dayjs@1.11.13/dayjs.min.js"></script>
    <script src="vendor/marked.min.js"></script>
    <script src="vendor/purify.min.js"></script>
    <script src="vendor/highlight.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/prism.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/autoloader/prism-autoloader.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/prismjs@1.29.0/plugins/line-numbers/prism-line-numbers.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/winbox@0.2.82/dist/winbox.bundle.min.js"></script>
  </head>
  <body class="sl-theme-dark">
    <main class="app-shell">
      <header class="app-header">
        <a class="brand" href="/" aria-label="eta home"
          ><span class="sigil">η</span><span class="wordmark">eta</span></a
        >
        <span class="host-identity" aria-label="Local host"
          ><span class="host-mark" aria-hidden="true">η</span
          ><span id="host-name">local</span></span
        >
        <div class="header-status">
          <span class="pulse"></span><span>READ ONLY</span
          ><span class="divider">·</span
          ><span id="server-status">CONNECTED</span>
        </div>
        <button class="icon-button" id="add-peer-button" title="Add PC">
          <i data-lucide="plus"></i>
        </button>
        <button
          class="icon-button"
          id="theme-button"
          title="Change highlight color"
        >
          <i data-lucide="palette"></i>
        </button>
      </header>

      <div id="explorer-backstore"></div>
      <template id="explorer-template">
        <section class="browser-panel" aria-label="Filesystem browser">
          <div class="toolbar">
            <label class="root-picker"
              ><i data-lucide="hard-drive"></i
              ><select
                data-explorer="root-select"
                aria-label="Filesystem root"
              ></select
              ><i data-lucide="chevron-down" class="chevron"></i
            ></label>
            <nav
              class="breadcrumbs"
              data-explorer="breadcrumbs"
              aria-label="Breadcrumb"
            ></nav>
            <div class="toolbar-actions">
              <button
                class="icon-button"
                data-explorer="view-toggle"
                title="Toggle image grid"
              >
                <i data-lucide="layout-grid"></i></button
              ><button
                class="icon-button"
                data-explorer="up-button"
                title="Up one folder"
              >
                <i data-lucide="arrow-up"></i></button
              ><button
                class="icon-button"
                data-explorer="refresh-button"
                title="Refresh"
              >
                <i data-lucide="refresh-cw"></i>
              </button>
            </div>
          </div>
          <div class="file-table" data-explorer="file-table">
            <div class="table-head">
              <span>Name</span><span>Modified</span><span>Size</span>
            </div>
            <div
              data-explorer="entries"
              class="entries"
              aria-live="polite"
            ></div>
          </div>
          <footer class="panel-footer">
            <span data-explorer="item-count">—</span>
          </footer>
        </section>
      </template>
    </main>
    <nav id="taskbar" class="taskbar" aria-label="Desktop taskbar">
      <button
        id="eta-launcher"
        class="eta-launcher"
        title="Open Explorer"
        aria-label="Open Explorer"
      >
        <span aria-hidden="true">η</span>
      </button>
      <div id="task-strip" class="task-strip" aria-label="Open windows"></div>
    </nav>

    <div id="file-context-menu" class="file-context-menu" hidden>
      <button type="button" data-file-action="trusted-html" hidden>
        <i data-lucide="external-link"></i> Open HTML trusted
      </button>
      <button type="button" data-file-action="terminal">
        <i data-lucide="terminal-square"></i> Open Terminal Here
      </button>
      <button type="button" data-file-action="send-peer">
        <i data-lucide="send"></i> Send to PC
      </button>
      <button type="button" data-file-action="rename">
        <i data-lucide="pencil"></i> Rename
      </button>
      <button type="button" data-file-action="delete" class="danger">
        <i data-lucide="trash-2"></i> Delete
      </button>
    </div>
    <sl-dialog id="preview-dialog" label="File preview" class="preview-dialog"
      ><div id="preview-content"></div>
      <div slot="footer">
        <sl-button id="copy-button"
          ><i data-lucide="copy"></i> Copy text</sl-button
        ><sl-button id="download-button" variant="primary"
          ><i data-lucide="download"></i> Download</sl-button
        ><sl-button id="close-dialog">Close</sl-button>
      </div></sl-dialog
    >
    <sl-dialog
      id="theme-dialog"
      label="Choose a highlight color"
      class="theme-dialog"
      ><div class="swatches" id="swatches"></div
    ></sl-dialog>
    <sl-alert id="error-toast" variant="danger" duration="5000" closable
      ><i slot="icon" data-lucide="circle-alert"></i
      ><span id="error-message"></span
    ></sl-alert>
    <script src="generated/app.js"></script>
  </body>
</html>
